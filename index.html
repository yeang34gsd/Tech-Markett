<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intercambia - Trueque de objetos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #1a472a 0%, #0f2c1c 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1300px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.2);
        }
        h1 { font-size: 2rem; color: #1a472a; margin-bottom: 4px; }
        .subtitle { color: #4a6741; margin-bottom: 24px; }
        .nav-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
        }
        .nav-btn {
            background: none;
            border: none;
            padding: 8px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 40px;
            transition: 0.2s;
            color: #4a6741;
        }
        .nav-btn.active {
            background: #1a472a;
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .upload-area {
            border: 3px dashed #4a6741;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            background: #f8faf0;
            transition: 0.2s;
        }
        .upload-area:hover { background: #eef3e6; border-color: #1a472a; }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #cbd5e1;
            border-radius: 60px;
            font-size: 1rem;
        }
        textarea { border-radius: 20px; resize: vertical; }
        button {
            background: #1a472a;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #0f2c1c; transform: scale(1.02); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }
        .objeto-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 6px 14px rgba(0,0,0,0.1);
            transition: 0.2s;
            position: relative;
        }
        .objeto-card:hover { transform: translateY(-5px); }
        .objeto-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .objeto-info { padding: 16px; }
        .badge {
            background: #1a472a;
            color: white;
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 12px;
            display: inline-block;
            margin: 8px 0;
        }
        .badge-expiracion {
            background: #e67e22;
            color: white;
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 11px;
            display: inline-block;
            margin: 4px 0;
        }
        .badge-sospechoso {
            background: #e67e22;
            color: white;
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 11px;
            display: inline-block;
            margin: 4px 0;
        }
        .intercambiar-btn {
            background: #1a472a;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 60px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        .reportar-btn {
            background: #e67e22;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 60px;
            cursor: pointer;
            margin-top: 5px;
            width: 100%;
            font-size: 12px;
        }
        .reportar-btn:hover { background: #d35400; }
        .eliminar-btn {
            background: #991b1b;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 60px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        .eliminar-btn:hover { background: #7f1d1d; }
        .chat-container {
            background: #f8faf0;
            border-radius: 24px;
            padding: 16px;
            max-height: 400px;
            overflow-y: auto;
        }
        .mensaje {
            background: white;
            border-radius: 20px;
            padding: 10px 16px;
            margin-bottom: 12px;
            max-width: 80%;
        }
        .mensaje.emisor {
            background: #1a472a;
            color: white;
            margin-left: auto;
        }
        .mensaje.receptor {
            background: #e2e8f0;
        }
        .mensaje small {
            font-size: 10px;
            opacity: 0.7;
            display: block;
        }
        .chat-input {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .chat-input input {
            flex: 1;
            margin: 0;
        }
        .login-section input {
            margin: 8px 0;
        }
        .flex-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .status-success {
            background: #bbf7d0;
            color: #166534;
            padding: 12px;
            border-radius: 60px;
            margin-top: 12px;
            text-align: center;
        }
        .status-error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 60px;
            margin-top: 12px;
            text-align: center;
        }
        .status-info {
            background: #dbeafe;
            color: #1e3a8a;
            padding: 12px;
            border-radius: 60px;
            margin-top: 12px;
            text-align: center;
        }
        .progress-container {
            background: #e2e8f0;
            border-radius: 40px;
            margin: 16px 0;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 8px;
            background: #1a472a;
            transition: width 0.2s;
        }
        .conv-item {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
            transition: 0.2s;
        }
        .conv-item:hover {
            background: #f0f4e8;
        }
        .hidden { display: none; }
        @media (max-width: 700px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>🔄 Intercambia</h1>
        <div class="subtitle">Trueque de objetos: publica lo que ofreces y conversa</div>
    </div>

    <!-- PANTALLA DE LOGIN/REGISTRO (visible al inicio) -->
    <div class="card" id="loginScreen">
        <h3>🔐 Accede o regístrate</h3>
        <div id="loginForm">
            <input type="email" id="loginEmail" placeholder="Correo electrónico">
            <input type="password" id="loginPassword" placeholder="Contraseña">
            <button id="doLoginBtn">Iniciar sesión</button>
            <p style="margin: 15px 0; text-align: center;">¿No tienes cuenta? <button id="showRegisterBtn" style="background: none; color: #1a472a; display: inline; padding: 0; font-weight: normal;">Regístrate</button></p>
        </div>
        <div id="registerForm" style="display: none;">
            <input type="email" id="registerEmail" placeholder="Correo electrónico">
            <input type="text" id="registerNombre" placeholder="Nombre (opcional)">
            <input type="password" id="registerPassword" placeholder="Contraseña">
            <input type="password" id="registerPassword2" placeholder="Repetir contraseña">
            <button id="doRegisterBtn">Registrarse</button>
            <p style="margin: 15px 0; text-align: center;"><button id="showLoginBtn" style="background: none; color: #1a472a; display: inline; padding: 0; font-weight: normal;">← Volver a iniciar sesión</button></p>
        </div>
        <div id="loginStatus"></div>
    </div>

    <!-- APP PRINCIPAL (oculta hasta login exitoso) -->
    <div id="appSections" class="hidden">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>📱 Bienvenido, <span id="userNombre">Usuario</span></h3>
                <button id="logoutBtn" style="background: #6c757d;">Cerrar sesión</button>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn active" data-tab="feed">📦 Objetos disponibles</button>
                <button class="nav-btn" data-tab="publicar">➕ Publicar objeto</button>
                <button class="nav-btn" data-tab="misobjetos">📋 Mis objetos</button>
                <button class="nav-btn" data-tab="chats">💬 Mis conversaciones</button>
            </div>

            <!-- FEED -->
            <div id="tab-feed">
                <h3>✨ Objetos para intercambiar</h3>
                <div id="feedGrid" class="grid">Cargando...</div>
            </div>

            <!-- PUBLICAR -->
            <div id="tab-publicar" style="display:none;">
                <h3>📸 Publicar un objeto</h3>
                <input type="text" id="titulo" placeholder="Título del objeto">
                <textarea id="descripcion" rows="2" placeholder="Descripción (estado, qué buscas a cambio...)"></textarea>
                <div class="upload-area" id="uploadArea">
                    <div>📁 Haz clic o arrastra una foto</div>
                    <input type="file" id="fileInput" accept="image/*" style="display:none;">
                </div>
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <button id="publicarBtn">Publicar objeto</button>
                <div id="pubStatus"></div>
            </div>

            <!-- MIS OBJETOS -->
            <div id="tab-misobjetos" style="display:none;">
                <h3>📌 Mis objetos publicados</h3>
                <div id="misObjetosGrid" class="grid">Cargando...</div>
            </div>

            <!-- CHATS -->
            <div id="tab-chats" style="display:none;">
                <h3>💬 Conversaciones activas</h3>
                <div id="listaChats"></div>
                <div id="chatDetalle" style="margin-top:24px; display:none;">
                    <h4 id="chatTitulo"></h4>
                    <div id="chatMensajes" class="chat-container"></div>
                    <div class="chat-input">
                        <input type="text" id="nuevoMensaje" placeholder="Escribe un mensaje...">
                        <button id="enviarMensajeBtn">Enviar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== CONFIGURACIÓN ==========
    const WORKER_URL = "https://subir-fotos-worker.yvellaurore02.workers.dev";
    const R2_PUBLIC_URL = "https://pub-ec355fc78ea64824955ad7015e4e7353.r2.dev";
    let currentUser = null;
    let currentToken = null;
    let chatActual = { objetoId: null, otroUsuario: null, titulo: null };

    // ========== FUNCIONES DE AUTENTICACIÓN ==========
    function guardarSesion(token, usuario) {
        currentToken = token;
        currentUser = usuario;
        localStorage.setItem('auth_token', token);
        localStorage.setItem('auth_user', JSON.stringify(usuario));
    }

    function limpiarSesion() {
        currentToken = null;
        currentUser = null;
        localStorage.removeItem('auth_token');
        localStorage.removeItem('auth_user');
    }

    function getAuthHeader() {
        return currentToken ? { 'Authorization': `Bearer ${currentToken}` } : {};
    }

    async function verificarSesion() {
        const token = localStorage.getItem('auth_token');
        const user = localStorage.getItem('auth_user');
        if (!token || !user) return false;
        
        try {
            const response = await fetch(`${WORKER_URL}/auth/verificar`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.ok) {
                currentToken = token;
                currentUser = JSON.parse(user);
                return true;
            } else {
                limpiarSesion();
                return false;
            }
        } catch(e) {
            return false;
        }
    }

    // ========== API ==========
    async function api(method, path, body = null, useAuth = true) {
        const headers = useAuth ? getAuthHeader() : {};
        const opts = { method, headers };
        
        if (body && !(body instanceof FormData)) {
            headers['Content-Type'] = 'application/json';
            opts.body = JSON.stringify(body);
        } else if (body instanceof FormData) {
            opts.body = body;
        }
        
        const res = await fetch(`${WORKER_URL}${path}`, opts);
        if (!res.ok) {
            const error = await res.text();
            throw new Error(error);
        }
        return res.json();
    }

    async function publicarObjeto(titulo, descripcion, file) {
        const form = new FormData();
        form.append('file', file);
        form.append('titulo', titulo);
        form.append('descripcion', descripcion);
        return await api('POST', '/objeto', form, true);
    }

    async function obtenerObjetos(propios = false) {
        if (propios) {
            return await api('GET', `/mis-objetos`, null, true);
        } else {
            return await api('GET', `/objetos`, null, true);
        }
    }

    async function eliminarObjeto(id) {
        return await api('DELETE', `/objeto/${id}`, null, true);
    }

    async function reportarObjeto(idObjeto, motivo) {
        return await api('POST', '/reporte', { id_objeto: idObjeto, motivo: motivo }, true);
    }

    async function enviarMensaje(objetoId, receptor, mensaje) {
        return await api('POST', '/mensaje', { id_objeto: objetoId, receptor, mensaje }, true);
    }

    async function obtenerMensajes(objetoId, otroUsuario) {
        return await api('GET', `/mensajes?id_objeto=${objetoId}&otro=${encodeURIComponent(otroUsuario)}`, null, true);
    }

    async function obtenerMisConversaciones() {
        return await api('GET', `/mis-conversaciones`, null, true);
    }

    // ========== LOGIN/REGISTRO ==========
    async function doLogin(email, password) {
        const result = await api('POST', '/auth/login', { email, password }, false);
        if (result.success) {
            guardarSesion(result.token, result.usuario);
            mostrarApp();
            showStatus('✅ Sesión iniciada correctamente', 'success', 'loginStatus');
        }
        return result;
    }

    async function doRegister(email, password, nombre) {
        const result = await api('POST', '/auth/registro', { email, password, nombre }, false);
        if (result.success) {
            showStatus('✅ Registro exitoso. Ahora inicia sesión.', 'success', 'loginStatus');
            mostrarLogin();
        }
        return result;
    }

    // ========== UI ==========
    function mostrarApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appSections').classList.remove('hidden');
        document.getElementById('userNombre').innerText = currentUser?.nombre || currentUser?.email || 'Usuario';
        cargarFeed();
        cargarMisObjetos();
    }

    function mostrarLogin() {
        document.getElementById('loginScreen').style.display = 'block';
        document.getElementById('appSections').classList.add('hidden');
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('loginEmail').value = '';
        document.getElementById('loginPassword').value = '';
    }

    async function cargarFeed() {
        try {
            const objetos = await obtenerObjetos(false);
            const feedDiv = document.getElementById('feedGrid');
            if (!objetos.length) {
                feedDiv.innerHTML = '<p>📭 No hay objetos publicados aún. ¡Sé el primero!</p>';
                return;
            }
            feedDiv.innerHTML = objetos.map(obj => `
                <div class="objeto-card">
                    <img src="${obj.url}" alt="${escapeHtml(obj.titulo)}">
                    <div class="objeto-info">
                        <strong>${escapeHtml(obj.titulo)}</strong>
                        <p>${escapeHtml(obj.descripcion?.substring(0, 100))}</p>
                        <span class="badge">👤 ${escapeHtml(obj.usuario)}</span>
                        ${obj.sospechoso === 1 ? '<span class="badge-sospechoso">⚠️ En revisión</span>' : ''}
                        ${obj.usuario !== currentUser.email ? `
                            <button class="intercambiar-btn" data-id="${obj.id}" data-usuario="${escapeHtml(obj.usuario)}" data-titulo="${escapeHtml(obj.titulo)}">💬 Intercambiar</button>
                            <button class="reportar-btn" data-id="${obj.id}" data-titulo="${escapeHtml(obj.titulo)}">⚠️ Reportar</button>
                        ` : '<span style="font-size:12px;">(tu objeto)</span>'}
                    </div>
                </div>
            `).join('');
            
            document.querySelectorAll('.intercambiar-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.dataset.id);
                    const otro = btn.dataset.usuario;
                    const titulo = btn.dataset.titulo;
                    abrirChatConObjeto(id, otro, titulo);
                });
            });
            
            document.querySelectorAll('.reportar-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const motivo = prompt('¿Por qué reportas este objeto? (ej: desnudo, spam, violencia, etc.)');
                    if (motivo && motivo.trim()) {
                        try {
                            await reportarObjeto(parseInt(btn.dataset.id), motivo);
                            alert('✅ Reporte enviado. Gracias por ayudar a mantener la comunidad segura.');
                        } catch (e) {
                            alert('❌ Error al reportar: ' + e.message);
                        }
                    }
                });
            });
        } catch (e) {
            console.error(e);
            document.getElementById('feedGrid').innerHTML = '<p>❌ Error al cargar objetos</p>';
        }
    }

    async function cargarMisObjetos() {
        try {
            const objetos = await obtenerObjetos(true);
            const div = document.getElementById('misObjetosGrid');
            if (!objetos.length) {
                div.innerHTML = '<p>📭 No has publicado nada aún.</p>';
                return;
            }
            div.innerHTML = objetos.map(obj => `
                <div class="objeto-card">
                    <img src="${obj.url}" alt="${escapeHtml(obj.titulo)}">
                    <div class="objeto-info">
                        <strong>${escapeHtml(obj.titulo)}</strong>
                        <p>${escapeHtml(obj.descripcion?.substring(0, 80))}</p>
                        <span class="badge">👤 Tú</span>
                        <span class="badge-expiracion">⏰ Expira: ${new Date(obj.expira).toLocaleDateString()}</span>
                        ${obj.sospechoso === 1 ? '<span class="badge-sospechoso">⚠️ En revisión por IA</span>' : ''}
                        <button class="eliminar-btn" data-id="${obj.id}">🗑️ Eliminar publicación</button>
                    </div>
                </div>
            `).join('');
            
            document.querySelectorAll('.eliminar-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (confirm('¿Eliminar esta publicación? Se borrará la foto y los mensajes asociados.')) {
                        try {
                            await eliminarObjeto(parseInt(btn.dataset.id));
                            alert('✅ Publicación eliminada');
                            cargarMisObjetos();
                            cargarFeed();
                        } catch (e) {
                            alert('❌ Error: ' + e.message);
                        }
                    }
                });
            });
        } catch (e) {
            console.error(e);
        }
    }

    async function abrirChatConObjeto(objetoId, otroUsuario, titulo) {
        chatActual = { objetoId, otroUsuario, titulo };
        document.getElementById('chatTitulo').innerHTML = `💬 ${escapeHtml(titulo)}<br><small>Conversando con ${escapeHtml(otroUsuario)}</small>`;
        document.getElementById('chatDetalle').style.display = 'block';
        await cargarMensajes();
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector('[data-tab="chats"]').classList.add('active');
        document.querySelectorAll('[id^="tab-"]').forEach(div => div.style.display = 'none');
        document.getElementById('tab-chats').style.display = 'block';
        cargarListaConversaciones();
    }

    async function cargarMensajes() {
        if (!chatActual.objetoId) return;
        const msgs = await obtenerMensajes(chatActual.objetoId, chatActual.otroUsuario);
        const cont = document.getElementById('chatMensajes');
        if (!msgs.length) {
            cont.innerHTML = '<p style="text-align:center;">✨ No hay mensajes aún. Escribe algo para empezar la conversación.</p>';
            return;
        }
        cont.innerHTML = msgs.map(m => `
            <div class="mensaje ${m.emisor === currentUser.email ? 'emisor' : 'receptor'}">
                <strong>${m.emisor === currentUser.email ? 'Tú' : escapeHtml(m.emisor)}</strong>: ${escapeHtml(m.mensaje)}
                <small>${new Date(m.fecha).toLocaleString()}</small>
            </div>
        `).join('');
        cont.scrollTop = cont.scrollHeight;
    }

    async function enviarMensajeChat() {
        const input = document.getElementById('nuevoMensaje');
        const texto = input.value.trim();
        if (!texto || !chatActual.objetoId) return;
        await enviarMensaje(chatActual.objetoId, chatActual.otroUsuario, texto);
        input.value = '';
        await cargarMensajes();
    }

    async function cargarListaConversaciones() {
        const convs = await obtenerMisConversaciones();
        const listaDiv = document.getElementById('listaChats');
        if (!convs.length) {
            listaDiv.innerHTML = '<p>💬 No hay conversaciones activas aún. Intercambia con alguien para empezar.</p>';
            return;
        }
        listaDiv.innerHTML = convs.map(c => `
            <div class="conv-item" data-id="${c.id_objeto}" data-otro="${escapeHtml(c.otroUsuario)}" data-titulo="${escapeHtml(c.titulo)}">
                <strong>📦 ${escapeHtml(c.titulo)}</strong><br>
                💬 con ${escapeHtml(c.otroUsuario)}<br>
                <small>Último mensaje: ${new Date(c.ultimaFecha).toLocaleString()}</small>
            </div>
        `).join('');
        document.querySelectorAll('.conv-item').forEach(el => {
            el.addEventListener('click', () => {
                abrirChatConObjeto(parseInt(el.dataset.id), el.dataset.otro, el.dataset.titulo);
            });
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function showStatus(msg, type, elementId = 'pubStatus') {
        const div = document.getElementById(elementId);
        if (!div) return;
        div.className = `status-${type}`;
        div.innerText = msg;
        setTimeout(() => {
            div.className = '';
            div.innerText = '';
        }, 3000);
    }

    // ========== EVENTOS LOGIN/REGISTRO ==========
    document.getElementById('doLoginBtn').onclick = async () => {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        if (!email || !password) {
            showStatus('❌ Completa email y contraseña', 'error', 'loginStatus');
            return;
        }
        try {
            await doLogin(email, password);
        } catch (e) {
            showStatus('❌ Error: ' + e.message, 'error', 'loginStatus');
        }
    };

    document.getElementById('doRegisterBtn').onclick = async () => {
        const email = document.getElementById('registerEmail').value;
        const nombre = document.getElementById('registerNombre').value;
        const password = document.getElementById('registerPassword').value;
        const password2 = document.getElementById('registerPassword2').value;
        
        if (!email || !password) {
            showStatus('❌ Completa email y contraseña', 'error', 'loginStatus');
            return;
        }
        if (password !== password2) {
            showStatus('❌ Las contraseñas no coinciden', 'error', 'loginStatus');
            return;
        }
        try {
            await doRegister(email, password, nombre);
        } catch (e) {
            showStatus('❌ Error: ' + e.message, 'error', 'loginStatus');
        }
    };

    document.getElementById('showRegisterBtn').onclick = () => {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
        document.getElementById('loginStatus').innerHTML = '';
    };

    document.getElementById('showLoginBtn').onclick = () => {
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('loginStatus').innerHTML = '';
    };

    document.getElementById('logoutBtn').onclick = () => {
        limpiarSesion();
        mostrarLogin();
        showStatus('Sesión cerrada', 'info', 'loginStatus');
    };

    // ========== EVENTOS APP ==========
    document.getElementById('publicarBtn').onclick = async () => {
        const titulo = document.getElementById('titulo').value;
        const descripcion = document.getElementById('descripcion').value;
        const file = document.getElementById('fileInput').files[0];
        if (!titulo || !descripcion || !file) {
            showStatus('❌ Completa título, descripción y foto', 'error', 'pubStatus');
            return;
        }
        const progressBar = document.getElementById('progressBar');
        try {
            let progress = 0;
            const interval = setInterval(() => {
                progress = Math.min(progress + 10, 90);
                progressBar.style.width = `${progress}%`;
            }, 200);
            const resultado = await publicarObjeto(titulo, descripcion, file);
            clearInterval(interval);
            progressBar.style.width = '100%';
            if (resultado.sospechoso) {
                showStatus('⚠️ Publicación recibida. Pasará por revisión moderadora.', 'info', 'pubStatus');
            } else {
                showStatus('✅ Objeto publicado correctamente', 'success', 'pubStatus');
            }
            setTimeout(() => { progressBar.style.width = '0%'; }, 2000);
            document.getElementById('titulo').value = '';
            document.getElementById('descripcion').value = '';
            document.getElementById('fileInput').value = '';
            cargarMisObjetos();
            cargarFeed();
        } catch (e) {
            showStatus('❌ Error: ' + e.message, 'error', 'pubStatus');
            progressBar.style.width = '0%';
        }
    };

    document.getElementById('enviarMensajeBtn').onclick = () => enviarMensajeChat();
    document.getElementById('nuevoMensaje').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') enviarMensajeChat();
    });

    // Navegación pestañas
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const tab = btn.dataset.tab;
            document.querySelectorAll('[id^="tab-"]').forEach(div => div.style.display = 'none');
            document.getElementById(`tab-${tab}`).style.display = 'block';
            if (tab === 'feed') cargarFeed();
            if (tab === 'misobjetos') cargarMisObjetos();
            if (tab === 'chats') cargarListaConversaciones();
        });
    });

    // Subida de foto
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    uploadArea.addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.style.background = '#eef3e6';
    });
    uploadArea.addEventListener('dragleave', () => {
        uploadArea.style.background = '#f8faf0';
    });
    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.style.background = '#f8faf0';
        fileInput.files = e.dataTransfer.files;
    });

    // Inicializar
    (async () => {
        const tieneSesion = await verificarSesion();
        if (tieneSesion) {
            mostrarApp();
        } else {
            mostrarLogin();
        }
    })();
</script>
</body>
</html>
