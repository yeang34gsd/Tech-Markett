<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 Galería Cloudflare R2 + D1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #1a1e2b 0%, #2a2f45 100%);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* Tarjetas */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(2px);
            border-radius: 32px;
            padding: 32px;
            margin-bottom: 28px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.25);
            transition: transform 0.2s ease;
        }

        h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #1E3C72, #2A5298);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #4a5568;
            border-left: 4px solid #3b82f6;
            padding-left: 16px;
            margin-top: 8px;
            font-weight: 500;
        }

        /* Área de subida */
        .upload-area {
            border: 3px dashed #3b82f6;
            border-radius: 28px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: 0.25s;
            background: #f8fafd;
        }

        .upload-area:hover {
            border-color: #2563eb;
            background: #eff6ff;
            transform: scale(0.99);
        }

        .upload-area.dragover {
            background: #dbeafe;
            border-color: #1e40af;
        }

        #fileInput {
            display: none;
        }

        .upload-icon {
            font-size: 56px;
            margin-bottom: 12px;
        }

        button {
            background: linear-gradient(95deg, #2563eb, #1e3a8a);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            transform: scale(1.02);
            background: linear-gradient(95deg, #1e40af, #1e3a8a);
        }

        .progress-container {
            background: #e2e8f0;
            border-radius: 40px;
            margin: 24px 0 12px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 12px;
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            transition: width 0.2s ease;
        }

        #status {
            margin: 16px 0;
            padding: 12px;
            border-radius: 60px;
            font-weight: 500;
            display: none;
            text-align: center;
        }

        .status-success {
            background: #bbf7d0;
            color: #166534;
            display: block;
        }

        .status-error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }

        .status-info {
            background: #dbeafe;
            color: #1e3a8a;
            display: block;
        }

        /* Galería */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            margin-top: 28px;
        }

        .gallery-item {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.2);
            transition: all 0.25s;
        }

        .gallery-item:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 25px -12px black;
        }

        .gallery-item img, .gallery-item video {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f1f5f9;
        }

        .gallery-item-info {
            padding: 14px;
            font-size: 13px;
            background: #ffffff;
            border-top: 1px solid #eef2ff;
        }

        /* Login */
        .login-section {
            background: white;
            border-radius: 32px;
            padding: 32px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 1px solid #cbd5e1;
            border-radius: 60px;
            font-size: 1rem;
            background: #fefefe;
        }

        .flex-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .btn-secondary {
            background: #4b5563;
        }

        .user-info {
            background: #eef2ff;
            padding: 16px;
            border-radius: 60px;
            margin-top: 20px;
            font-weight: 500;
            text-align: center;
        }

        footer {
            text-align: center;
            color: #cbd5e1;
            margin-top: 40px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>🚀 Galería Cloudflare R2 + D1</h1>
        <div class="subtitle">📸 Guardado real — las fotos no desaparecen 🔁</div>
    </div>

    <!-- LOGIN -->
    <div class="login-section" id="loginSection">
        <h3>🔐 Acceso</h3>
        <input type="email" id="email" placeholder="Correo electrónico" autocomplete="email">
        <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
        <div class="flex-buttons">
            <button id="loginBtn">Iniciar sesión</button>
            <button id="registerBtn" class="btn-secondary">Registrarse</button>
            <button id="logoutBtn" style="display:none;" class="btn-secondary">Cerrar sesión</button>
        </div>
        <div id="userInfo" class="user-info" style="display:none;"></div>
    </div>

    <!-- SUBIR ARCHIVO (solo logueado) -->
    <div class="card" id="uploadSection" style="display:none;">
        <h3>📤 Subir foto o vídeo</h3>
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📎</div>
            <p>Arrastra o haz clic para seleccionar</p>
            <input type="file" id="fileInput" accept="image/*,video/*">
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div id="status"></div>
        <button id="uploadBtn">Subir ahora</button>
    </div>

    <!-- GALERÍA GLOBAL -->
    <div class="card">
        <h3>🖼️ Lo que comparte la comunidad</h3>
        <div id="gallery" class="gallery">
            <p style="grid-column:1/-1; text-align:center;">✨ Cargando archivos...</p>
        </div>
    </div>
    <footer>✅ Almacenamiento R2 + Base de datos D1 — Persistencia real</footer>
</div>

<script>
    // ==============================================
    // 🔁 ÚNICO PUNTO A MODIFICAR (TUS URLs REALES)
    // ==============================================
    const WORKER_URL = "https://subir-fotos-worker.yvellaurore02.workers.dev";
    const R2_PUBLIC_URL = "https://pub-ec355fc78ea64824955ad7015e4e7353.r2.dev";

    // ==============================================
    // 🧠 Sistema simple de usuarios (localStorage)
    // ==============================================
    let currentUser = null;

    function registerUser(email, password) {
        const users = JSON.parse(localStorage.getItem('app_users') || '{}');
        if (users[email]) throw new Error('❌ El usuario ya existe');
        users[email] = { password: btoa(password) };
        localStorage.setItem('app_users', JSON.stringify(users));
        return true;
    }

    function loginUser(email, password) {
        const users = JSON.parse(localStorage.getItem('app_users') || '{}');
        const user = users[email];
        if (!user || user.password !== btoa(password)) throw new Error('❌ Email o contraseña incorrectos');
        currentUser = { email };
        localStorage.setItem('app_currentUser', JSON.stringify(currentUser));
        updateUIForUser();
        return true;
    }

    function logoutUser() {
        currentUser = null;
        localStorage.removeItem('app_currentUser');
        updateUIForUser();
    }

    function updateUIForUser() {
        const loginSection = document.getElementById('loginSection');
        const uploadSection = document.getElementById('uploadSection');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userInfoDiv = document.getElementById('userInfo');

        if (currentUser) {
            loginSection.querySelector('h3').innerText = '✅ Sesión activa';
            loginBtn.style.display = 'none';
            registerBtn.style.display = 'none';
            logoutBtn.style.display = 'inline-block';
            userInfoDiv.style.display = 'block';
            userInfoDiv.innerHTML = `👤 ${currentUser.email}`;
            uploadSection.style.display = 'block';
        } else {
            loginSection.querySelector('h3').innerText = '🔐 Accede o regístrate';
            loginBtn.style.display = 'inline-block';
            registerBtn.style.display = 'inline-block';
            logoutBtn.style.display = 'none';
            userInfoDiv.style.display = 'none';
            uploadSection.style.display = 'none';
        }
    }

    // ==============================================
    // 🌐 Comunicación con Worker (R2 + D1)
    // ==============================================
    async function cargarFotosDesdeDB() {
        try {
            const res = await fetch(`${WORKER_URL}/fotos`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const fotos = await res.json();
            const galleryDiv = document.getElementById('gallery');

            if (!fotos.length) {
                galleryDiv.innerHTML = '<p style="grid-column:1/-1; text-align:center;">📭 Aún no hay archivos. ¡Sé el primero en subir!</p>';
                return;
            }

            let html = '';
            for (const foto of fotos) {
                const fileUrl = `${R2_PUBLIC_URL}/${foto.fileName}`;
                if (foto.tipo.startsWith('image/')) {
                    html += `
                        <div class="gallery-item">
                            <img src="${fileUrl}" loading="lazy" alt="${foto.nombre}">
                            <div class="gallery-item-info">
                                <strong>${escapeHtml(foto.nombre.substring(0, 35))}</strong><br>
                                👤 ${escapeHtml(foto.usuario)}<br>
                                📅 ${new Date(foto.fecha).toLocaleDateString()}
                            </div>
                        </div>
                    `;
                } else if (foto.tipo.startsWith('video/')) {
                    html += `
                        <div class="gallery-item">
                            <video src="${fileUrl}" controls preload="metadata"></video>
                            <div class="gallery-item-info">
                                <strong>${escapeHtml(foto.nombre.substring(0, 35))}</strong><br>
                                👤 ${escapeHtml(foto.usuario)}<br>
                                📅 ${new Date(foto.fecha).toLocaleDateString()}
                            </div>
                        </div>
                    `;
                }
            }
            galleryDiv.innerHTML = html;
        } catch (err) {
            console.error(err);
            document.getElementById('gallery').innerHTML = '<p style="grid-column:1/-1; text-align:center;">⚠️ Error al cargar los archivos</p>';
        }
    }

    async function subirFotoWorker(file, usuario) {
        const form = new FormData();
        form.append('file', file);
        form.append('usuario', usuario);

        const resp = await fetch(WORKER_URL, {
            method: 'POST',
            body: form
        });
        if (!resp.ok) {
            const texto = await resp.text();
            throw new Error(texto || `Error HTTP ${resp.status}`);
        }
        return await resp.json();
    }

    // Mini utilidad XSS
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ==============================================
    // 🎛️ Eventos y UI
    // ==============================================
    function showStatus(msg, type) {
        const div = document.getElementById('status');
        div.className = `status-${type}`;
        div.innerText = msg;
        div.style.display = 'block';
        setTimeout(() => {
            div.style.display = 'none';
        }, 3500);
    }

    // Botones
    document.getElementById('loginBtn').onclick = () => {
        try {
            loginUser(document.getElementById('email').value, document.getElementById('password').value);
            showStatus('✅ Bienvenido', 'success');
            cargarFotosDesdeDB();
        } catch (e) {
            showStatus(e.message, 'error');
        }
    };
    document.getElementById('registerBtn').onclick = () => {
        try {
            registerUser(document.getElementById('email').value, document.getElementById('password').value);
            showStatus('✅ Registro exitoso, ahora inicia sesión', 'success');
        } catch (e) {
            showStatus(e.message, 'error');
        }
    };
    document.getElementById('logoutBtn').onclick = () => {
        logoutUser();
        showStatus('🔓 Sesión cerrada', 'info');
        cargarFotosDesdeDB();
    };

    // Subida
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    const progressBar = document.getElementById('progressBar');

    uploadBtn.addEventListener('click', async () => {
        const file = fileInput.files[0];
        if (!file) return showStatus('❌ Selecciona un archivo', 'error');
        if (!currentUser) return showStatus('❌ Debes iniciar sesión', 'error');

        showStatus('⏫ Subiendo a Cloudflare R2...', 'info');
        progressBar.style.width = '0%';

        let interval;
        try {
            let prog = 0;
            interval = setInterval(() => {
                prog = Math.min(prog + 12, 90);
                progressBar.style.width = `${prog}%`;
            }, 200);

            const result = await subirFotoWorker(file, currentUser.email);
            clearInterval(interval);
            progressBar.style.width = '100%';
            showStatus('✅ ¡Subida correcta! La foto ya está en la galería', 'success');
            fileInput.value = '';
            setTimeout(() => { progressBar.style.width = '0%'; }, 1500);
            await cargarFotosDesdeDB();
        } catch (err) {
            clearInterval(interval);
            progressBar.style.width = '0%';
            showStatus(`❌ Falla: ${err.message}`, 'error');
            console.error(err);
        }
    });

    // Drag & drop
    const area = document.getElementById('uploadArea');
    area.addEventListener('click', () => fileInput.click());
    area.addEventListener('dragover', (e) => {
        e.preventDefault();
        area.classList.add('dragover');
    });
    area.addEventListener('dragleave', () => area.classList.remove('dragover'));
    area.addEventListener('drop', (e) => {
        e.preventDefault();
        area.classList.remove('dragover');
        if (e.dataTransfer.files.length) fileInput.files = e.dataTransfer.files;
    });

    // Restaurar sesión guardada
    const saved = localStorage.getItem('app_currentUser');
    if (saved) {
        try {
            currentUser = JSON.parse(saved);
            updateUIForUser();
        } catch(e) { console.warn(e); }
    }
    // Cargar galería real desde D1
    cargarFotosDesdeDB();
</script>
</body>
</html>
