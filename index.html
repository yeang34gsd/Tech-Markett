<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Intercambia - Trueque de objetos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f8f9fc;
      color: #111;
    }
    .internal-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: white;
      padding: 12px 24px;
      border-radius: 60px;
      font-size: 0.85rem;
      z-index: 1500;
      transition: transform 0.25s ease, opacity 0.2s;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(8px);
      background: rgba(15, 23, 42, 0.9);
      white-space: normal;
      text-align: center;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .internal-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* Login */
    .login-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #ffffff 0%, #f0f4fa 100%);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.35s;
    }
    .login-screen.hidden { visibility: hidden; opacity: 0; pointer-events: none; }
    .login-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px);
      border-radius: 48px;
      width: 90%;
      max-width: 380px;
      padding: 2.2rem 1.5rem;
      box-shadow: 0 25px 45px -12px rgba(0,0,0,0.25);
      text-align: center;
    }
    .login-icon {
      background: #1b74e4;
      width: 70px;
      height: 70px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .login-icon i { font-size: 2.4rem; color: white; }
    .login-card h2 { font-size: 1.9rem; font-weight: 700; color: #1e293b; }
    .login-card p { color: #5b6c8f; font-size: 0.9rem; margin: 0.5rem 0 1.5rem; }
    .btn-google {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 60px;
      padding: 0.9rem 1rem;
      width: 100%;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
    }

    /* App */
    .app-container { opacity: 0; visibility: hidden; transition: opacity 0.3s; }
    .app-container.active { opacity: 1; visibility: visible; }
    .market-header {
      background: white;
      border-bottom: 1px solid #eef2f6;
      position: sticky;
      top: 0;
      z-index: 90;
      padding: 0.7rem 0.9rem;
    }
    .header-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
    }
    .logo-area { display: flex; align-items: center; gap: 0.3rem; }
    .market-icon { font-size: 1.8rem; color: #1b74e4; }
    .logo-text { font-size: 1.35rem; font-weight: 800; color: #0a2540; }
    .search-bar { flex: 1; }
    .search-wrapper {
      background: #f1f5f9;
      border-radius: 40px;
      padding: 0.45rem 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid #e2e8f0;
    }
    .search-wrapper input {
      background: transparent;
      border: none;
      width: 100%;
      font-size: 0.85rem;
      outline: none;
    }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    
    /* Botón de categorías */
    .categories-btn-container {
      position: relative;
    }
    .categories-btn {
      background: #f1f5f9;
      border: none;
      border-radius: 40px;
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: #1e293b;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .categories-dropdown {
      position: absolute;
      top: 45px;
      left: 0;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 200px;
      overflow: hidden;
      z-index: 100;
      display: none;
    }
    .categories-dropdown.show { display: block; }
    .cat-dropdown-item {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.85rem;
      color: #1e293b;
    }
    .cat-dropdown-item:hover { background: #f1f5f9; }
    .cat-dropdown-item i { width: 20px; color: #64748b; }
    .cat-dropdown-item.active { background: #1b74e4; color: white; }
    .cat-dropdown-item.active i { color: white; }
    
    /* Menú de perfil */
    .profile-menu-container { position: relative; }
    .profile-badge {
      background: #eef2ff;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0.2rem 0.6rem 0.2rem 0.2rem;
      cursor: pointer;
    }
    .mini-avatar {
      width: 32px;
      height: 32px;
      border-radius: 40px;
      background: #3b82f6;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      overflow: hidden;
    }
    .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }
    
    .profile-dropdown {
      position: absolute;
      top: 45px;
      right: 0;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 200px;
      overflow: hidden;
      z-index: 100;
      display: none;
    }
    .profile-dropdown.show { display: block; }
    .dropdown-item {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.85rem;
      font-weight: 500;
      color: #1e293b;
    }
    .dropdown-item:hover { background: #f1f5f9; }
    .dropdown-item i { width: 20px; color: #64748b; }
    .dropdown-divider { height: 1px; background: #e2e8f0; margin: 4px 0; }
    
    .sell-btn {
      background: #1b74e4;
      border-radius: 30px;
      padding: 0 1rem;
      height: 38px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    
    .listings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 0.9rem;
      padding: 0 0.9rem 1rem;
      margin-top: 1rem;
    }
    .product-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid #edf2f7;
      position: relative;
    }
    .favorite-star {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255,255,255,0.8);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #94a3b8;
      z-index: 2;
      backdrop-filter: blur(2px);
      font-size: 1.1rem;
    }
    .favorite-star.active { color: #eab308; }
    .delete-btn {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(220,38,38,0.9);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      z-index: 2;
      font-size: 0.8rem;
    }
    .card-img {
      aspect-ratio: 1/1;
      background: #f1f5f9;
      position: relative;
      overflow: hidden;
    }
    .card-img img { width: 100%; height: 100%; object-fit: cover; }
    .miniaturas {
      display: flex;
      gap: 4px;
      padding: 6px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(4px);
      overflow-x: auto;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
    }
    .miniatura { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
    .miniatura.activa { border-color: #1b74e4; }
    .card-info { padding: 0.6rem; }
    .badge-intercambio {
      background: #10b981;
      color: white;
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 4px;
    }
    .title { font-size: 0.85rem; font-weight: 600; color: #1e293b; margin: 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .usuario {
      font-size: 0.7rem;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
      cursor: pointer;
    }
    .ubicacion { font-size: 0.65rem; color: #94a3b8; display: flex; align-items: center; gap: 4px; margin-top: 4px; }
    .intercambiar-btn {
      background: #1b74e4;
      border: none;
      border-radius: 40px;
      padding: 6px 12px;
      margin-top: 8px;
      width: 100%;
      color: white;
      font-weight: 600;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .reportar-btn {
      background: #f59e0b;
      border: none;
      border-radius: 40px;
      padding: 4px 8px;
      margin-top: 4px;
      width: 100%;
      font-size: 0.6rem;
      color: white;
      cursor: pointer;
    }
    .load-more { text-align: center; margin: 1rem 0 2rem; }
    .load-more-btn { background: #fff; border:1px solid #cbd5e1; padding:0.6rem 1.8rem; border-radius:40px; font-weight:600; cursor: pointer; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    .modal-content { max-width: 90vw; max-height: 90vh; text-align: center; }
    .modal-content img { max-width: 100%; max-height: 75vh; border-radius: 20px; }
    .modal-content button { margin-top: 16px; background: white; padding: 8px 20px; border-radius: 40px; border: none; cursor: pointer; font-weight: 600; }

    /* Chat */
    .chat-sidebar {
      position: fixed;
      top: 0;
      right: -100%;
      width: 100%;
      max-width: 400px;
      height: 100%;
      background: white;
      z-index: 1000;
      transition: right 0.3s ease;
      box-shadow: -2px 0 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }
    .chat-sidebar.open { right: 0; }
    .chat-header {
      padding: 1rem;
      background: #1b74e4;
      color: white;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .chat-header button {
      background: none;
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .message {
      max-width: 80%;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
    }
    .message.sent {
      background: #1b74e4;
      color: white;
      align-self: flex-end;
    }
    .message.received {
      background: #f1f5f9;
      color: #1e293b;
      align-self: flex-start;
    }
    .chat-input {
      padding: 1rem;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 0.5rem;
    }
    .chat-input input {
      flex: 1;
      padding: 0.7rem;
      border: 1px solid #e2e8f0;
      border-radius: 40px;
      outline: none;
    }
    .chat-input button {
      background: #1b74e4;
      border: none;
      border-radius: 40px;
      padding: 0 1.2rem;
      color: white;
      cursor: pointer;
    }

    /* Upload panel */
    .upload-panel-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      opacity: 0;
      transition: 0.2s;
    }
    .upload-panel-overlay.active { visibility: visible; opacity: 1; }
    .upload-panel {
      background: white;
      width: 90%;
      max-width: 500px;
      border-radius: 48px;
      padding: 1.8rem 1.5rem;
      max-height: 90vh;
      overflow-y: auto;
    }
    .upload-panel h3 { font-size: 1.6rem; font-weight: 700; margin-bottom: 1rem; }
    .upload-panel input, .upload-panel select, .upload-panel textarea {
      width: 100%;
      padding: 0.9rem;
      margin-bottom: 1rem;
      border-radius: 30px;
      border: 1px solid #e2e8f0;
      background: #f9fafc;
      outline: none;
    }
    .upload-area {
      border: 2px dashed #cbd5e1;
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      margin-bottom: 1rem;
      cursor: pointer;
    }
    .fotos-preview { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .foto-preview { position: relative; width: 80px; height: 80px; }
    .foto-preview img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
    .foto-preview button {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      cursor: pointer;
    }
    .btn-publish {
      background: #1b74e4;
      color: white;
      border: none;
      padding: 0.9rem;
      border-radius: 40px;
      font-weight: 700;
      width: 100%;
      margin-top: 0.5rem;
      cursor: pointer;
    }
    .btn-cancel {
      background: #f1f5f9;
      border: none;
      padding: 0.9rem;
      border-radius: 40px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .panel-actions { display: flex; gap: 1rem; margin-top: 0.5rem; }
  </style>
</head>
<body>

<div id="internalToast" class="internal-toast"><i class="fas fa-info-circle"></i> <span id="toastMessage"></span></div>

<!-- Login -->
<div id="loginScreen" class="login-screen">

    <button id="googleLoginBtn" class="btn-google"><i class="fab fa-google"></i> Iniciar sesión con Google</button>
  </div>
</div>

<!-- App Principal -->
<div id="appContainer" class="app-container">
  <header class="market-header">
    <div class="header-container">
      <div class="logo-area"><i class="fas fa-exchange-alt market-icon"></i><span class="logo-text">Intercambia</span></div>
      <div class="search-bar"><div class="search-wrapper"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Buscar objetos..."></div></div>
      <div class="header-actions">

            </div>
            <div class="dropdown-divider"></div>
            <div class="dropdown-item" data-action="perfil">
              <i class="fas fa-user-circle"></i> Mi perfil
            </div>
            <div class="dropdown-item" data-action="logout">
              <i class="fas fa-sign-out-alt"></i> Cerrar sesión

        <div id="openUploadPanelBtn" class="sell-btn"><i class="fas fa-plus-circle"></i> <span>Publicar</span></div>

  </header>

  <!-- Grid de resultados -->
  <div id="feedGrid" class="listings-grid"></div>
  <div class="load-more"><button id="loadMoreBtn" class="load-more-btn">Cargar más</button></div>
</div>

<!-- Chat lateral -->
<div id="chatSidebar" class="chat-sidebar">
  <div class="chat-header">
    <button id="closeChatBtn"><i class="fas fa-arrow-left"></i></button>
    <span id="chatWithName">Chat</span>
  </div>
  <div id="chatMessages" class="chat-messages"></div>
  <div class="chat-input">
    <input type="text" id="chatInput" placeholder="Escribe un mensaje...">
    <button id="sendChatBtn">Enviar</button>

<!-- Panel Publicar -->
<div id="uploadPanelOverlay" class="upload-panel-overlay">

<!-- Modal fotos -->
<div id="fotoModal" class="modal">
  <div class="modal-content">

    <button onclick="document.getElementById('fotoModal').style.display='none'">Cerrar</button>
  </div>
</div>

<script>
  // ========== CONFIGURACIÓN ==========
  const WORKER_URL = "https://subir-fotos-worker.yvellaurore02.workers.dev";
  const R2_PUBLIC_URL = "https://pub-ec355fc78ea64824955ad7015e4e7353.r2.dev";
  
  let currentUser = null;
  let authToken = null;
  let favoritosIds = new Set();
  let todosProductos = [];
  let misProductos = [];
  let currentView = "todos"; // todos, misobjetos, favoritos, chats
  let currentCategory = "all";
  let searchQuery = "";
  let visibleItems = 8;
  let selectedFiles = [];
  
  // Chat
  let chatObjetoId = null;
  let chatConUsuario = null;
  let mensajesPolling = null;

  // ========== TOAST ==========
  function showToast(msg, isError = false) {
    const toast = document.getElementById("internalToast");
    document.getElementById("toastMessage").innerText = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2600);
  }

  // ========== AUTENTICACIÓN ==========
  function getTokenFromURL() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    if (token) { localStorage.setItem('auth_token', token); window.history.replaceState({}, document.title, window.location.pathname); return token; }
    return localStorage.getItem('auth_token');
  }
  
  async function verifyToken(token) {
    try {
      const res = await fetch(`${WORKER_URL}/auth/me`, { headers: { 'Authorization': `Bearer ${token}` } });
      if (!res.ok) return null;
      const data = await res.json();
      return data.user;
    } catch(e) { return null; }
  }
  
  function loginWithGoogle() { window.location.href = `${WORKER_URL}/auth/google?redirect=${encodeURIComponent(window.location.href)}`; }
  
  async function logout() { localStorage.removeItem('auth_token'); authToken = null; currentUser = null; location.reload(); }

  // ========== API ==========
  async function apiFetch(path, options = {}) {
    const headers = options.headers || {};
    if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
    const res = await fetch(`${WORKER_URL}${path}`, { ...options, headers });
    if (!res.ok) { if (res.status === 401) logout(); throw new Error(await res.text()); }
    return res.json();
  }
  
  async function obtenerObjetos() { return await apiFetch('/objetos'); }
  async function obtenerMisObjetos() { return await apiFetch('/mis-objetos'); }
  async function obtenerFavoritos() { try { return await apiFetch('/favoritos'); } catch(e) { return []; } }
  async function agregarFavorito(id) { return await apiFetch('/favoritos', { method: 'POST', body: JSON.stringify({ id_objeto: id }) }); }
  async function quitarFavorito(id) { return await apiFetch('/favoritos', { method: 'DELETE', body: JSON.stringify({ id_objeto: id }) }); }
  async function eliminarObjeto(id) { return await apiFetch(`/objeto/${id}`, { method: 'DELETE' }); }
  async function enviarMensaje(objetoId, receptor, mensaje) { return await apiFetch('/mensaje', { method: 'POST', body: JSON.stringify({ id_objeto: objetoId, receptor, mensaje }) }); }
  async function obtenerMensajes(objetoId, otroUsuario) { return await apiFetch(`/mensajes?id_objeto=${objetoId}&otro=${encodeURIComponent(otroUsuario)}`); }
  async function obtenerConversaciones() { return await apiFetch('/mis-conversaciones'); }
  
  async function publicarObjeto(titulo, descripcion, categoria, ubicacion, fotos) {
    const form = new FormData();
    form.append('titulo', titulo);
    form.append('descripcion', `${categoria} | ${descripcion} | ${ubicacion || 'Sin ubicación'}`);
    form.append('direccion', ubicacion || '');
    for (let i = 0; i < Math.min(fotos.length, 5); i++) form.append(`foto_${i}`, fotos[i]);
    return await apiFetch('/objeto', { method: 'POST', body: form });
  }

  // ========== FAVORITOS ==========
  async function toggleFavorito(id, btn) {
    if (favoritosIds.has(id)) { 
      await quitarFavorito(id); 
      favoritosIds.delete(id); 
      if (btn) btn.classList.remove('active');
      showToast('Eliminado de favoritos');
    } else { 
      await agregarFavorito(id); 
      favoritosIds.add(id); 
      if (btn) btn.classList.add('active');
      showToast('Agregado a favoritos');
    }
    if (currentView === 'favoritos') await renderFavoritos();
    if (currentView === 'todos') renderTodos();
  }

  // ========== RENDER ==========
  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
  
  function renderProductosGrid(productos, showDelete = false) {
    const grid = document.getElementById("feedGrid");
    if (!productos || productos.length === 0) { 
      grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:2rem;"><i class="fas fa-store-slash" style="font-size:2rem; color:#94a3b8;"></i><p style="margin-top:8px;">No hay objetos para mostrar</p></div>`; 
      return; 
    }
    
    grid.innerHTML = productos.map(p => {
      const categoria = p.descripcion?.split('|')[0]?.trim() || 'General';
      const ubicacion = p.direccion || (p.descripcion?.split('|')[2]?.trim()) || 'Sin ubicación';
      const esFavorito = favoritosIds.has(p.id);
      const fotosExtra = p.fotos_extra || [];
      const todasLasFotos = [p.url, ...fotosExtra.map(f => f.url)];
      const esMiObjeto = currentUser && p.usuario === currentUser.email;
      
      return `
        <div class="product-card" data-id="${p.id}">
          <div class="favorite-star ${esFavorito ? 'active' : ''}" onclick="event.stopPropagation(); toggleFavorito(${p.id}, this)">${esFavorito ? '★' : '☆'}</div>
          ${showDelete && esMiObjeto ? `<div class="delete-btn" onclick="event.stopPropagation(); eliminarObjetoPrompt(${p.id})"><i class="fas fa-trash-alt"></i></div>` : ''}
          <div class="card-img">
            <img class="imagen-principal" src="${p.url}" onerror="this.src='https://placehold.co/300x300?text=Sin+imagen'" onclick="mostrarFotoAmpliada('${p.url}')">
            ${todasLasFotos.length > 1 ? `
              <div class="miniaturas">
                ${todasLasFotos.map((url, idx) => `<img class="miniatura ${idx === 0 ? 'activa' : ''}" src="${url}" onerror="this.src='https://placehold.co/60x60?text=Error'" onclick="event.stopPropagation(); cambiarFotoPrincipal(this, '${url}')">`).join('')}
              </div>
            ` : ''}
          </div>
          <div class="card-info">
            <span class="badge-intercambio">🔄 Trueque</span>
            <div class="title">${escapeHtml(p.titulo)}</div>
            <div class="usuario" onclick="verPerfilUsuario('${escapeHtml(p.usuario)}')"><i class="fas fa-user-circle"></i> ${escapeHtml(p.usuario)}</div>
            <div class="ubicacion"><i class="fas fa-map-marker-alt"></i> ${escapeHtml(ubicacion)}</div>
            ${p.usuario !== currentUser?.email ? `
              <button class="intercambiar-btn" onclick="abrirChat(${p.id}, '${escapeHtml(p.usuario)}', '${escapeHtml(p.titulo)}')">💬 Intercambiar</button>
              <button class="reportar-btn" onclick="reportarObjeto(${p.id})">⚠️ Reportar</button>
            ` : '<span style="font-size:11px; color:#94a3b8; text-align:center; display:block; margin-top:8px;">(tu objeto)</span>'}
          </div>
        </div>
      `;
    }).join('');
  }
  
  window.cambiarFotoPrincipal = (miniatura, url) => {
    const card = miniatura.closest('.product-card');
    const imgPrincipal = card.querySelector('.imagen-principal');
    imgPrincipal.src = url;
    card.querySelectorAll('.miniatura').forEach(m => m.classList.remove('activa'));
    miniatura.classList.add('activa');
  };
  
  window.mostrarFotoAmpliada = (url) => { 
    document.getElementById('fotoModalImg').src = url; 
    document.getElementById('fotoModal').style.display = 'flex'; 
  };
  
  window.verPerfilUsuario = (email) => { showToast(`👤 Perfil de ${email}`); };
  
  window.eliminarObjetoPrompt = async (id) => {
    if (confirm('¿Eliminar esta publicación? No se puede deshacer.')) {
      try {
        await eliminarObjeto(id);
        showToast('✅ Publicación eliminada');
        if (currentView === 'misobjetos') await renderMisObjetos();
        if (currentView === 'todos') renderTodos();
      } catch(e) { showToast('❌ Error al eliminar', true); }
    }
  };
  
  window.reportarObjeto = async (id) => {
    const motivo = prompt('Motivo del reporte:');
    if (motivo && motivo.trim()) { 
      await apiFetch('/reporte', { method: 'POST', body: JSON.stringify({ id_objeto: id, motivo }) }); 
      showToast('✅ Reporte enviado'); 
    }
  };
  
  function renderTodos() {
    let filtered = [...todosProductos];
    if (currentCategory !== "all") filtered = filtered.filter(p => (p.descripcion?.split('|')[0]?.trim() || 'General') === currentCategory);
    if (searchQuery.trim()) {
      const q = searchQuery.toLowerCase();
      filtered = filtered.filter(p => p.titulo.toLowerCase().includes(q) || p.usuario.toLowerCase().includes(q));
    }
    filtered.sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
    const toShow = filtered.slice(0, visibleItems);
    renderProductosGrid(toShow, false);
    const loadBtn = document.getElementById("loadMoreBtn");
    if (filtered.length <= visibleItems) loadBtn.style.display = "none";
    else loadBtn.style.display = "inline-block";
  }
  
  async function renderMisObjetos() {
    try {
      misProductos = await obtenerMisObjetos();
      renderProductosGrid(misProductos, true);
      document.getElementById("loadMoreBtn").style.display = "none";
    } catch(e) { showToast('Error cargando tus objetos', true); }
  }
  
  async function renderFavoritos() {
    try {
      const favoritos = await obtenerFavoritos();
      renderProductosGrid(favoritos, false);
      document.getElementById("loadMoreBtn").style.display = "none";
    } catch(e) { showToast('Error cargando favoritos', true); }
  }
  
  async function renderConversaciones() {
    try {
      const convs = await obtenerConversaciones();
      const grid = document.getElementById("feedGrid");
      if (!convs.length) {
        grid.innerHTML = `<div style="text-align:center; padding:2rem;"><i class="fas fa-comments" style="font-size:2rem; color:#94a3b8;"></i><p>No hay conversaciones activas</p></div>`;
        return;
      }
      grid.innerHTML = convs.map(c => `
        <div style="background:white; border-radius:20px; padding:1rem; margin-bottom:0.5rem; cursor:pointer;" onclick="abrirChat(${c.id_objeto}, '${escapeHtml(c.otroUsuario)}', '${escapeHtml(c.titulo)}')">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div><strong>${escapeHtml(c.titulo)}</strong><br><small>con ${escapeHtml(c.otroUsuario)}</small></div>
            <i class="fas fa-comment-dots" style="color:#1b74e4;"></i>
          </div>
          <div style="font-size:0.7rem; color:#64748b; margin-top:4px;">Último mensaje: ${new Date(c.ultimaFecha).toLocaleString()}</div>
        </div>
      `).join('');
      document.getElementById("loadMoreBtn").style.display = "none";
    } catch(e) { console.error(e); }
  }
  
  function switchToView(view) {
    currentView = view;
    visibleItems = 8;
    
    if (view === 'todos') renderTodos();
    else if (view === 'misobjetos') renderMisObjetos();
    else if (view === 'favoritos') renderFavoritos();
    else if (view === 'chats') renderConversaciones();
  }
  
  function loadMore() { visibleItems += 8; if (currentView === 'todos') renderTodos(); }

  // ========== CHAT ==========
  async function cargarMensajes() {
    if (!chatObjetoId || !chatConUsuario) return;
    try {
      const mensajes = await obtenerMensajes(chatObjetoId, chatConUsuario);
      const container = document.getElementById('chatMessages');
      container.innerHTML = mensajes.map(m => `
        <div class="message ${m.emisor === currentUser?.email ? 'sent' : 'received'}">
          <strong>${m.emisor === currentUser?.email ? 'Tú' : m.emisor}</strong>: ${escapeHtml(m.mensaje)}
          <div style="font-size:0.6rem; opacity:0.7;">${new Date(m.fecha).toLocaleTimeString()}</div>
        </div>
      `).join('');
      container.scrollTop = container.scrollHeight;
    } catch(e) { console.error(e); }
  }
  
  async function enviarMensajeChat() {
    const input = document.getElementById('chatInput');
    const texto = input.value.trim();
    if (!texto || !chatObjetoId || !chatConUsuario) return;
    input.value = '';
    await enviarMensaje(chatObjetoId, chatConUsuario, texto);
    await cargarMensajes();
  }
  
  function startPolling() {
    if (mensajesPolling) clearInterval(mensajesPolling);
    mensajesPolling = setInterval(() => {
      if (chatObjetoId && chatConUsuario) cargarMensajes();
    }, 3000);
  }
  
  window.abrirChat = async (objetoId, otroUsuario, titulo) => {
    chatObjetoId = objetoId;
    chatConUsuario = otroUsuario;
    document.getElementById('chatWithName').innerText = `${titulo} - con ${otroUsuario}`;
    document.getElementById('chatSidebar').classList.add('open');
    await cargarMensajes();
    startPolling();
  };
  
  function cerrarChat() {
    if (mensajesPolling) clearInterval(mensajesPolling);
    chatObjetoId = null;
    chatConUsuario = null;
    document.getElementById('chatSidebar').classList.remove('open');
  }
  
  document.getElementById('closeChatBtn').onclick = cerrarChat;
  document.getElementById('sendChatBtn').onclick = enviarMensajeChat;
  document.getElementById('chatInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') enviarMensajeChat(); });

  // ========== SUBIDA ==========
  function actualizarPreviews() {
    const container = document.getElementById('fotosPreview');
    container.innerHTML = '';
    selectedFiles.forEach((file, idx) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const div = document.createElement('div'); div.className = 'foto-preview';
        div.innerHTML = `<img src="${e.target.result}"><button onclick="eliminarFoto(${idx})">✕</button>`;
        container.appendChild(div);
      };
      reader.readAsDataURL(file);
    });
  }
  
  window.eliminarFoto = (idx) => { selectedFiles.splice(idx, 1); actualizarPreviews(); };
  
  document.getElementById('uploadArea').onclick = () => document.getElementById('fileInput').click();
  document.getElementById('fileInput').onchange = (e) => {
    const archivos = Array.from(e.target.files);
    selectedFiles = [...selectedFiles, ...archivos].slice(0, 5);
    actualizarPreviews();
  };
  
  document.getElementById('openUploadPanelBtn').onclick = () => {
    if (!currentUser) { showToast('Inicia sesión primero', true); return; }
    document.getElementById('uploadPanelOverlay').classList.add('active');
  };
  
  document.getElementById('cancelUploadBtn').onclick = () => document.getElementById('uploadPanelOverlay').classList.remove('active');
  
  document.getElementById('publishArticleBtn').onclick = async () => {
    const titulo = document.getElementById('uploadTitle').value.trim();
    const categoria = document.getElementById('uploadCategory').value;
    const desc = document.getElementById('uploadDesc').value.trim();
    const ubicacion = document.getElementById('uploadLocation').value.trim();
    if (!titulo || !desc || selectedFiles.length === 0) { 
      showToast('❌ Completa título, descripción y al menos una foto', true); 
      return; 
    }
    try {
      await publicarObjeto(titulo, desc, categoria, ubicacion, selectedFiles);
      showToast('✅ Objeto publicado correctamente');
      document.getElementById('uploadPanelOverlay').classList.remove('active');
      document.getElementById('uploadTitle').value = '';
      document.getElementById('uploadDesc').value = '';
      document.getElementById('uploadLocation').value = '';
      selectedFiles = [];
      actualizarPreviews();
      await cargarProductos();
      if (currentView === 'misobjetos') await renderMisObjetos();
    } catch(e) { showToast('❌ Error: ' + e.message, true); }
  };

  // ========== CARGAR DATOS ==========
  async function cargarProductos() {
    try {
      const objetos = await obtenerObjetos();
      todosProductos = objetos;
      renderTodos();
    } catch(e) { showToast('Error al cargar productos', true); }
  }
  
  async function cargarFavoritosIniciales() {
    const favs = await obtenerFavoritos();
    favoritosIds = new Set(favs.map(f => f.id));
  }

  // ========== CATEGORÍAS ==========
  function setupCategorias() {
    const categories = ["all", "Electrónica", "Ropa", "Libros", "Mascotas", "Hogar", "Deportes", "Otros"];
    const catNames = { all:"Todos", Electronica:"Electrónica", Ropa:"Ropa", Libros:"Libros", Mascotas:"Mascotas", Hogar:"Hogar", Deportes:"Deportes", Otros:"Otros" };
    
    document.querySelectorAll('.cat-dropdown-item').forEach(item => {
      item.addEventListener('click', () => {
        const cat = item.getAttribute('data-cat');
        currentCategory = cat;
        visibleItems = 8;
        
        document.querySelectorAll('.cat-dropdown-item').forEach(c => c.classList.remove('active'));
        item.classList.add('active');
        
        categoriesDropdown.classList.remove('show');
        renderTodos();
      });
    });
  }
  
  // Cerrar dropdowns al hacer clic fuera
  document.addEventListener('click', () => {
    categoriesDropdown.classList.remove('show');
    profileDropdown.classList.remove('show');
  });
  
  const categoriesBtn = document.getElementById('categoriesBtn');
  const categoriesDropdown = document.getElementById('categoriesDropdown');
  categoriesBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    categoriesDropdown.classList.toggle('show');
  });
  
  document.getElementById("searchInput").addEventListener('input', (e) => { searchQuery = e.target.value; visibleItems = 8; renderTodos(); });
  document.getElementById("loadMoreBtn").addEventListener('click', loadMore);
  
  // Menú de perfil
  const profileBadge = document.getElementById('userProfileBadge');
  const profileDropdown = document.getElementById('profileDropdown');
  
  profileBadge.addEventListener('click', (e) => {
    e.stopPropagation();
    profileDropdown.classList.toggle('show');
  });
  
  document.querySelectorAll('.dropdown-item').forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      const action = item.getAttribute('data-action');
      if (action === 'misobjetos') switchToView('misobjetos');
      else if (action === 'favoritos') switchToView('favoritos');
      else if (action === 'chats') switchToView('chats');
      else if (action === 'perfil') showToast(`👤 ${currentUser?.name || currentUser?.email}`);
      else if (action === 'logout') logout();
      profileDropdown.classList.remove('show');
    });
  });

  // ========== INICIALIZACIÓN ==========
  async function init() {
    const token = getTokenFromURL();
    if (token) { 
      authToken = token; 
      const user = await verifyToken(token); 
      if (user) {
        currentUser = user;
      } else { 
        localStorage.removeItem('auth_token'); 
        authToken = null; 
      }
    }
    
    if (currentUser) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appContainer').classList.add('active');
      const avatarDiv = document.getElementById('headerAvatar');
      if (currentUser.picture) avatarDiv.innerHTML = `<img src="${currentUser.picture}">`;
      else avatarDiv.innerHTML = `<i class="fas fa-user"></i>`;
      document.getElementById('headerUserName').innerText = currentUser.name?.split(' ')[0] || 'Perfil';
      await cargarFavoritosIniciales();
      await cargarProductos();
      setupCategorias();
    } else {
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('appContainer').classList.remove('active');
    }
  }
  
  document.getElementById("googleLoginBtn").onclick = loginWithGoogle;
  init();
  
  // OneSignal
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) { 
    await OneSignal.init({ 
      appId: "68491021-9c85-423d-9e50-ddcffa0c2d63", 
      notifyButton: { enable: true, position: 'bottom-right', theme: 'inverse' } 
    }); 
  });
</script>
</body>
</html>
