<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Intercambia - Trueque de objetos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Leaflet (mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f8f9fc;
      color: #111;
    }

    .internal-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: white;
      padding: 12px 24px;
      border-radius: 60px;
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 1500;
      transition: transform 0.25s ease, opacity 0.2s;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(8px);
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      white-space: normal;
      text-align: center;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .internal-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* Pantalla Login */
    .login-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #ffffff 0%, #f0f4fa 100%);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      visibility: visible;
      opacity: 1;
    }
    .login-screen.hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px);
      border-radius: 48px;
      width: 90%;
      max-width: 380px;
      padding: 2.2rem 1.5rem;
      box-shadow: 0 25px 45px -12px rgba(0,0,0,0.25);
      text-align: center;
    }
    .login-icon {
      background: #1b74e4;
      width: 70px;
      height: 70px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .login-icon i { font-size: 2.4rem; color: white; }
    .login-card h2 { font-size: 1.9rem; font-weight: 700; margin-bottom: 0.4rem; color: #1e293b; }
    .login-card p { color: #5b6c8f; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .btn-google {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 60px;
      padding: 0.9rem 1rem;
      width: 100%;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .btn-google:active { transform: scale(0.97); }

    /* App Principal */
    .app-container {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
    }
    .app-container.active { opacity: 1; visibility: visible; }
    .market-header {
      background: #ffffff;
      border-bottom: 1px solid #eef2f6;
      position: sticky;
      top: 0;
      z-index: 90;
      padding: 0.7rem 0.9rem;
    }
    .header-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
    }
    .logo-area { display: flex; align-items: center; gap: 0.3rem; cursor: pointer; }
    .market-icon { font-size: 1.8rem; color: #1b74e4; }
    .logo-text { font-size: 1.35rem; font-weight: 800; color: #0a2540; }
    .search-bar { flex: 1; }
    .search-wrapper {
      background: #f1f5f9;
      border-radius: 40px;
      padding: 0.45rem 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid #e2e8f0;
    }
    .search-wrapper input {
      background: transparent;
      border: none;
      width: 100%;
      font-size: 0.85rem;
      outline: none;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .profile-badge {
      background: #eef2ff;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0.2rem 0.6rem 0.2rem 0.2rem;
      cursor: pointer;
    }
    .mini-avatar {
      width: 32px;
      height: 32px;
      border-radius: 40px;
      background: #3b82f6;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      overflow: hidden;
    }
    .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .sell-btn {
      background: #1b74e4;
      border-radius: 30px;
      padding: 0 1rem;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .sell-btn i { font-size: 1.1rem; }
    .sell-btn span { font-size: 0; width: 0; overflow: hidden; } /* Oculta el texto "Publicar" */
    .categories-nav {
      background: white;
      overflow-x: auto;
      padding: 0.6rem 0;
      margin-bottom: 12px;
      white-space: nowrap;
      display: flex;
      gap: 8px;
      padding-left: 1rem;
    }
    .cat-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0.4rem 1rem;
      font-weight: 500;
      color: #5b6c8f;
      border-radius: 40px;
      background: #f1f5f9;
      cursor: pointer;
    }
    .cat-item.active { background: #1b74e4; color: white; }
    .listings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 0.9rem;
      padding: 0 0.9rem 1rem;
    }
    .product-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid #edf2f7;
      transition: 0.1s;
      position: relative;
    }
    .product-card:active { transform: scale(0.98); }
    .favorite-star {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255,255,255,0.8);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #94a3b8;
      z-index: 2;
      backdrop-filter: blur(2px);
      font-size: 1.1rem;
    }
    .favorite-star.active { color: #eab308; }
    .card-img {
      aspect-ratio: 1/1;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s; }
    .miniaturas {
      display: flex;
      gap: 4px;
      padding: 6px;
      background: white;
      border-top: 1px solid #eef2ff;
      overflow-x: auto;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(4px);
    }
    .miniatura { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
    .miniatura.activa { border-color: #1b74e4; }
    .card-info { padding: 0.6rem; }
    .title { font-size: 0.85rem; font-weight: 600; color: #1e293b; margin: 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .usuario {
      font-size: 0.7rem;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
      cursor: pointer;
    }
    .usuario i { font-size: 0.65rem; }
    .ubicacion {
      font-size: 0.65rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
    }
    .btn-chat {
      background: #1b74e4;
      border: none;
      border-radius: 40px;
      padding: 6px 12px;
      margin-top: 8px;
      width: 100%;
      color: white;
      font-weight: 600;
      font-size: 0.7rem;
      cursor: pointer;
      transition: 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-chat:active { transform: scale(0.97); }
    .reportar-btn {
      background: #f59e0b;
      border: none;
      border-radius: 40px;
      padding: 4px 8px;
      margin-top: 4px;
      width: 100%;
      font-size: 0.6rem;
      color: white;
      cursor: pointer;
    }
    .load-more { text-align: center; margin: 1rem 0 2rem; }
    .load-more-btn { background: #fff; border:1px solid #cbd5e1; padding:0.6rem 1.8rem; border-radius:40px; font-weight:600; cursor: pointer; }
    .badge-intercambio {
      background: #10b981;
      color: white;
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 4px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    .modal-content { max-width: 90vw; max-height: 90vh; text-align: center; }
    .modal-content img { max-width: 100%; max-height: 75vh; border-radius: 20px; }
    .modal-content button { margin-top: 16px; background: white; padding: 8px 20px; border-radius: 40px; border: none; cursor: pointer; font-weight: 600; }

    .upload-panel-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      opacity: 0;
      transition: 0.2s;
    }
    .upload-panel-overlay.active { visibility: visible; opacity: 1; }
    .upload-panel {
      background: white;
      width: 90%;
      max-width: 500px;
      border-radius: 48px;
      padding: 1.8rem 1.5rem;
      max-height: 90vh;
      overflow-y: auto;
    }
    .upload-panel h3 { font-size: 1.6rem; font-weight: 700; margin-bottom: 1rem; }
    .upload-panel input, .upload-panel select, .upload-panel textarea {
      width: 100%;
      padding: 0.9rem;
      margin-bottom: 1rem;
      border-radius: 30px;
      border: 1px solid #e2e8f0;
      background: #f9fafc;
      font-family: inherit;
      outline: none;
    }
    .upload-area {
      border: 2px dashed #cbd5e1;
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      margin-bottom: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .upload-area:hover { border-color: #1b74e4; background: #f8fafc; }
    .uploading-indicator { text-align: center; padding: 10px; color: #1b74e4; display: none; }
    .fotos-preview { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .foto-preview { position: relative; width: 80px; height: 80px; }
    .foto-preview img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
    .foto-preview button {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-publish {
      background: #1b74e4;
      color: white;
      border: none;
      padding: 0.9rem;
      border-radius: 40px;
      font-weight: 700;
      width: 100%;
      margin-top: 0.5rem;
      cursor: pointer;
      transition: 0.1s;
    }
    .btn-publish:disabled { opacity: 0.6; transform: none; cursor: not-allowed; }
    .btn-cancel {
      background: #f1f5f9;
      border: none;
      padding: 0.9rem;
      border-radius: 40px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .panel-actions { display: flex; gap: 1rem; margin-top: 0.5rem; }
    .ubicacion-activa {
      background: #e8f0fe;
      border-radius: 20px;
      padding: 8px;
      margin-top: 8px;
      font-size: 11px;
      color: #1b74e4;
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
    }
    .geolocalizando {
      background: #fef3c7;
      color: #d97706;
    }
    .loading-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #fff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="internalToast" class="internal-toast"><i class="fas fa-info-circle"></i> <span id="toastMessage"></span></div>

<!-- Pantalla Login -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-icon"><i class="fas fa-exchange-alt"></i></div>
    <h2>Intercambia</h2>
    <p>Trueque de objetos - Publica, intercambia y conversa</p>
    <button id="googleLoginBtn" class="btn-google"><i class="fab fa-google"></i> Iniciar sesión con Google</button>
  </div>
</div>

<!-- App Principal -->
<div id="appContainer" class="app-container">
  <header class="market-header">
    <div class="header-container">
      <div class="logo-area" id="homeBtn">
        <i class="fas fa-home market-icon"></i>
        <span class="logo-text">Inicio</span>
      </div>
      <div class="search-bar"><div class="search-wrapper"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Buscar objetos..."></div></div>
      <div class="header-actions">
        <div id="userProfileBadge" class="profile-badge">
          <div id="headerAvatar" class="mini-avatar"><i class="fas fa-user"></i></div>
          <span id="headerUserName" style="font-size:0.75rem;">Perfil</span>
        </div>
        <div id="openUploadPanelBtn" class="sell-btn"><i class="fas fa-plus-circle"></i> <span>Publicar</span></div>
      </div>
    </div>
  </header>
  
  <div class="categories-nav" id="categoriesNav"></div>
  <div class="listings-grid" id="listingsGrid"></div>
  <div class="load-more"><button id="loadMoreBtn" class="load-more-btn">Cargar más</button></div>
</div>

<!-- Panel Publicar -->
<div id="uploadPanelOverlay" class="upload-panel-overlay">
  <div class="upload-panel">
    <h3><i class="fas fa-cloud-upload-alt"></i> Nuevo objeto</h3>
    <input type="text" id="uploadTitle" placeholder="Título *">
    <select id="uploadCategory">
      <option value="Electrónica">📱 Electrónica</option>
      <option value="Ropa">👕 Ropa</option>
      <option value="Libros">📚 Libros</option>
      <option value="Mascotas">🐾 Mascotas</option>
      <option value="Hogar">🏠 Hogar</option>
      <option value="Deportes">⚽ Deportes</option>
      <option value="Otros">🎁 Otros</option>
    </select>
    <textarea id="uploadDesc" rows="2" placeholder="Descripción (estado, qué buscas a cambio...) *"></textarea>
    <div id="uploadLocationPanel">
      <div id="ubicacionStatus" class="ubicacion-activa geolocalizando">
        <i class="fas fa-location-dot"></i> <span id="ubicacionTexto">Obteniendo ubicación...</span>
        <div class="loading-spinner"></div>
      </div>
    </div>
    <div id="uploadArea" class="upload-area">📸 Haz clic para seleccionar fotos (máx 5)</div>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
    <div id="fotosPreview" class="fotos-preview"></div>
    <div id="uploadingIndicator" class="uploading-indicator"><i class="fas fa-spinner fa-pulse"></i> Publicando...</div>
    <div class="panel-actions">
      <button id="cancelUploadBtn" class="btn-cancel">Cancelar</button>
      <button id="publishArticleBtn" class="btn-publish"><i class="fas fa-cloud-upload-alt"></i> Publicar</button>
    </div>
  </div>
</div>

<!-- Modal fotos -->
<div id="fotoModal" class="modal">
  <div class="modal-content">
    <img id="fotoModalImg" src="">
    <button onclick="document.getElementById('fotoModal').style.display='none'">Cerrar</button>
  </div>
</div>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  // ========== CONFIGURACIÓN ==========
  const WORKER_URL = "https://subir-fotos-worker.yvellaurore02.workers.dev";
  const R2_PUBLIC_URL = "https://pub-ec355fc78ea64824955ad7015e4e7353.r2.dev";
  
  let currentUser = null;
  let authToken = null;
  let favoritosIds = new Set();
  let productosGlobal = [];
  let productosFiltrados = [];
  let currentCategory = "all";
  let searchQuery = "";
  let visibleItems = 8;
  let selectedFiles = [];
  let modoHome = false; // Modo "Hogar": muestra mis publicaciones + favoritas
  let ubicacionActual = { lat: null, lng: null, direccion: "" };
  
  // Control para evitar publicaciones duplicadas
  let isPublishing = false;

  // ========== TOAST ==========
  function showToast(msg, isError = false) {
    const toast = document.getElementById("internalToast");
    document.getElementById("toastMessage").innerText = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2600);
  }

  // ========== AUTENTICACIÓN ==========
  function getTokenFromURL() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    if (token) { localStorage.setItem('auth_token', token); window.history.replaceState({}, document.title, window.location.pathname); return token; }
    return localStorage.getItem('auth_token');
  }
  
  async function verifyToken(token) {
    try {
      const res = await fetch(`${WORKER_URL}/auth/me`, { headers: { 'Authorization': `Bearer ${token}` } });
      if (!res.ok) return null;
      const data = await res.json();
      return data.user;
    } catch(e) { return null; }
  }
  
  function loginWithGoogle() { window.location.href = `${WORKER_URL}/auth/google?redirect=${encodeURIComponent(window.location.href)}`; }
  
  async function logout() { localStorage.removeItem('auth_token'); authToken = null; currentUser = null; location.reload(); }

  // ========== API ==========
  async function apiFetch(path, options = {}) {
    const headers = options.headers || {};
    if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
    const res = await fetch(`${WORKER_URL}${path}`, { ...options, headers });
    if (!res.ok) { if (res.status === 401) logout(); throw new Error(await res.text()); }
    return res.json();
  }
  
  async function obtenerObjetos() { return await apiFetch('/objetos'); }
  async function obtenerFavoritos() { try { return await apiFetch('/favoritos'); } catch(e) { return []; } }
  async function agregarFavorito(id) { return await apiFetch('/favoritos', { method: 'POST', body: JSON.stringify({ id_objeto: id }) }); }
  async function quitarFavorito(id) { return await apiFetch('/favoritos', { method: 'DELETE', body: JSON.stringify({ id_objeto: id }) }); }
  
  async function publicarObjeto(titulo, descripcion, categoria, ubicacion, lat, lng, fotos) {
    const form = new FormData();
    form.append('titulo', titulo);
    form.append('descripcion', `${categoria} | ${descripcion} | ${ubicacion || 'Sin ubicación'}`);
    form.append('direccion', ubicacion || '');
    form.append('latitud', lat || '');
    form.append('longitud', lng || '');
    for (let i = 0; i < Math.min(fotos.length, 5); i++) form.append(`foto_${i}`, fotos[i]);
    return await apiFetch('/objeto', { method: 'POST', body: form });
  }

  // ========== GEOLOCALIZACIÓN ==========
  function obtenerUbicacionActual() {
    const statusDiv = document.getElementById("ubicacionStatus");
    const textSpan = document.getElementById("ubicacionTexto");
    
    if (!navigator.geolocation) {
      textSpan.innerText = "Geolocalización no soportada";
      statusDiv.classList.remove("geolocalizando");
      ubicacionActual.direccion = "Ubicación no disponible";
      return;
    }
    
    navigator.geolocation.getCurrentPosition(
      async (position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        ubicacionActual.lat = lat;
        ubicacionActual.lng = lng;
        
        // Obtener dirección desde coordenadas
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&accept-language=es`);
          const data = await res.json();
          if (data.address) {
            const partes = [];
            if (data.address.road) partes.push(data.address.road);
            if (data.address.house_number) partes.push(data.address.house_number);
            if (data.address.suburb) partes.push(data.address.suburb);
            if (data.address.city || data.address.town) partes.push(data.address.city || data.address.town);
            ubicacionActual.direccion = partes.join(', ') || data.display_name?.split(',')[0] || "Ubicación capturada";
          } else {
            ubicacionActual.direccion = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
          }
        } catch(e) {
          ubicacionActual.direccion = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        }
        
        textSpan.innerText = ubicacionActual.direccion.substring(0, 50);
        statusDiv.classList.remove("geolocalizando");
        statusDiv.innerHTML = `<i class="fas fa-check-circle"></i> <span>${ubicacionActual.direccion.substring(0, 50)}</span>`;
        showToast("📍 Ubicación capturada correctamente");
      },
      (error) => {
        console.error("Error de geolocalización:", error);
        textSpan.innerText = "No se pudo obtener ubicación";
        statusDiv.classList.remove("geolocalizando");
        statusDiv.style.background = "#fee2e2";
        statusDiv.style.color = "#dc2626";
        ubicacionActual.direccion = "";
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  // ========== FAVORITOS ==========
  async function toggleFavorito(id, btn) {
    if (favoritosIds.has(id)) { 
      await quitarFavorito(id); 
      favoritosIds.delete(id); 
      btn.classList.remove('active'); 
      btn.innerHTML = '☆'; 
      showToast('Eliminado de favoritos');
      if (modoHome) await cargarProductos(true);
    } else { 
      await agregarFavorito(id); 
      favoritosIds.add(id); 
      btn.classList.add('active'); 
      btn.innerHTML = '★'; 
      showToast('Agregado a favoritos');
      if (modoHome) await cargarProductos(true);
    }
  }

  // ========== RENDER PRODUCTOS ==========
  function mezclarArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  
  function filtrarProductos() {
    let filtered = [...productosGlobal];
    
    // Modo Home: muestra mis publicaciones + favoritas
    if (modoHome && currentUser) {
      const misPublicaciones = filtered.filter(p => p.usuario === currentUser.email);
      const misFavoritos = filtered.filter(p => favoritosIds.has(p.id) && p.usuario !== currentUser.email);
      filtered = [...misPublicaciones, ...misFavoritos];
    }
    
    if (currentCategory !== "all") filtered = filtered.filter(p => (p.descripcion?.split('|')[0]?.trim() || 'General') === currentCategory);
    if (searchQuery.trim()) {
      const q = searchQuery.toLowerCase();
      filtered = filtered.filter(p => p.titulo.toLowerCase().includes(q) || p.usuario.toLowerCase().includes(q));
    }
    
    // Mezclar aleatoriamente
    filtered = mezclarArray([...filtered]);
    productosFiltrados = filtered;
    return filtered;
  }
  
  function renderProductos() {
    const filtered = filtrarProductos();
    const toShow = filtered.slice(0, visibleItems);
    const grid = document.getElementById("listingsGrid");
    if (toShow.length === 0) { 
      grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:2rem;"><i class="fas fa-store-slash" style="font-size:2rem; color:#94a3b8;"></i><p style="margin-top:8px;">${modoHome ? 'No tienes publicaciones ni favoritos aún' : 'No hay objetos publicados aún'}</p></div>`; 
      return; 
    }
    
    grid.innerHTML = toShow.map(p => {
      const categoria = p.descripcion?.split('|')[0]?.trim() || 'General';
      const descripcion = p.descripcion?.split('|')[1]?.trim() || '';
      const ubicacion = p.direccion || (p.descripcion?.split('|')[2]?.trim()) || 'Sin ubicación';
      const esFavorito = favoritosIds.has(p.id);
      const fotosExtra = p.fotos_extra || [];
      const todasLasFotos = [p.url, ...fotosExtra.map(f => f.url)];
      const esMiPublicacion = currentUser && p.usuario === currentUser.email;
      
      return `
        <div class="product-card" data-id="${p.id}" data-cat="${categoria}">
          <div class="favorite-star ${esFavorito ? 'active' : ''}" data-id="${p.id}" onclick="event.stopPropagation(); toggleFavorito(${p.id}, this)">${esFavorito ? '★' : '☆'}</div>
          <div class="card-img">
            <img class="imagen-principal" src="${p.url}" onerror="this.src='https://placehold.co/300x300?text=Sin+imagen'" onclick="event.stopPropagation(); mostrarFotoAmpliada('${p.url}')">
            ${todasLasFotos.length > 1 ? `
              <div class="miniaturas">
                ${todasLasFotos.map((url, idx) => `<img class="miniatura ${idx === 0 ? 'activa' : ''}" src="${url}" onerror="this.src='https://placehold.co/60x60?text=Error'" onclick="event.stopPropagation(); cambiarFotoPrincipal(this.closest('.product-card'), '${url}', this)">`).join('')}
              </div>
            ` : ''}
          </div>
          <div class="card-info">
            <span class="badge-intercambio">🔄 Trueque</span>
            <div class="title">${escapeHtml(p.titulo)}</div>
            <div class="usuario" onclick="event.stopPropagation(); verPerfilUsuario('${escapeHtml(p.usuario)}')"><i class="fas fa-user-circle"></i> ${escapeHtml(p.usuario)}</div>
            <div class="ubicacion"><i class="fas fa-map-marker-alt"></i> ${escapeHtml(ubicacion)}</div>
            ${!esMiPublicacion ? `
              <button class="btn-chat" onclick="event.stopPropagation(); abrirChatConObjeto(${p.id}, '${escapeHtml(p.usuario)}', '${escapeHtml(p.titulo)}')"><i class="fas fa-comment-dots"></i> Chatear</button>
              <button class="reportar-btn" onclick="event.stopPropagation(); reportarObjetoPrompt(${p.id})">⚠️ Reportar</button>
            ` : '<span style="font-size:11px; color:#94a3b8; text-align:center; display:block; margin-top:8px;">(tu objeto)</span>'}
          </div>
        </div>
      `;
    }).join('');
    
    const loadBtn = document.getElementById("loadMoreBtn");
    if (filtered.length <= visibleItems) loadBtn.style.display = "none";
    else loadBtn.style.display = "inline-block";
  }
  
  function loadMore() { visibleItems += 8; renderProductos(); }
  
  window.cambiarFotoPrincipal = (card, url, miniatura) => {
    const imgPrincipal = card.querySelector('.imagen-principal');
    imgPrincipal.src = url;
    card.querySelectorAll('.miniatura').forEach(m => m.classList.remove('activa'));
    miniatura.classList.add('activa');
  };
  
  window.mostrarFotoAmpliada = (url) => { 
    document.getElementById('fotoModalImg').src = url; 
    document.getElementById('fotoModal').style.display = 'flex'; 
  };
  
  window.verPerfilUsuario = (email) => { showToast(`👤 Perfil de ${email}`); };
  
  window.abrirChatConObjeto = (id, usuario, titulo) => { showToast(`💬 Chat con ${usuario} sobre "${titulo}"`); };
  
  window.reportarObjetoPrompt = async (id) => {
    const motivo = prompt('Motivo del reporte:');
    if (motivo && motivo.trim()) { 
      await apiFetch('/reporte', { method: 'POST', body: JSON.stringify({ id_objeto: id, motivo }) }); 
      showToast('✅ Reporte enviado, gracias por ayudar'); 
    }
  };
  
  window.toggleFavorito = toggleFavorito;

  // ========== SUBIDA DE FOTOS ==========
  function actualizarPreviews() {
    const container = document.getElementById('fotosPreview');
    container.innerHTML = '';
    selectedFiles.forEach((file, idx) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const div = document.createElement('div'); div.className = 'foto-preview';
        div.innerHTML = `<img src="${e.target.result}"><button onclick="eliminarFoto(${idx})">✕</button>`;
        container.appendChild(div);
      };
      reader.readAsDataURL(file);
    });
  }
  
  window.eliminarFoto = (idx) => { selectedFiles.splice(idx, 1); actualizarPreviews(); };
  
  document.getElementById('uploadArea').onclick = () => document.getElementById('fileInput').click();
  document.getElementById('fileInput').onchange = (e) => {
    const archivos = Array.from(e.target.files);
    const nuevos = [...selectedFiles, ...archivos].slice(0, 5);
    if (nuevos.length < selectedFiles.length + archivos.length) showToast("Máximo 5 fotos", true);
    selectedFiles = nuevos;
    actualizarPreviews();
  };
  
  document.getElementById('openUploadPanelBtn').onclick = () => {
    if (!currentUser) { showToast('Inicia sesión primero', true); return; }
    document.getElementById('uploadPanelOverlay').classList.add('active');
    obtenerUbicacionActual(); // Obtener ubicación al abrir el panel
  };
  
  document.getElementById('cancelUploadBtn').onclick = () => {
    document.getElementById('uploadPanelOverlay').classList.remove('active');
    isPublishing = false;
    document.getElementById('publishArticleBtn').disabled = false;
  };
  
  document.getElementById('publishArticleBtn').onclick = async () => {
    if (isPublishing) { showToast('Ya se está publicando, espera...', true); return; }
    
    const titulo = document.getElementById('uploadTitle').value.trim();
    const categoria = document.getElementById('uploadCategory').value;
    const desc = document.getElementById('uploadDesc').value.trim();
    const ubicacion = ubicacionActual.direccion || document.getElementById('uploadLocation')?.value || '';
    
    if (!titulo || !desc || selectedFiles.length === 0) { 
      showToast('❌ Completa título, descripción y al menos una foto', true); 
      return; 
    }
    
    isPublishing = true;
    const publishBtn = document.getElementById('publishArticleBtn');
    const uploadIndicator = document.getElementById('uploadingIndicator');
    const originalText = publishBtn.innerHTML;
    publishBtn.disabled = true;
    publishBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Publicando...';
    uploadIndicator.style.display = 'block';
    
    try {
      await publicarObjeto(titulo, desc, categoria, ubicacion, ubicacionActual.lat, ubicacionActual.lng, selectedFiles);
      showToast('✅ Objeto publicado correctamente');
      document.getElementById('uploadPanelOverlay').classList.remove('active');
      document.getElementById('uploadTitle').value = '';
      document.getElementById('uploadDesc').value = '';
      selectedFiles = [];
      actualizarPreviews();
      await cargarProductos();
    } catch(e) { 
      showToast('❌ Error: ' + e.message, true); 
    } finally {
      isPublishing = false;
      publishBtn.disabled = false;
      publishBtn.innerHTML = originalText;
      uploadIndicator.style.display = 'none';
    }
  };

  // ========== CARGAR PRODUCTOS ==========
  async function cargarProductos(mantenerModo = false) {
    try {
      const objetos = await obtenerObjetos();
      productosGlobal = objetos;
      if (!mantenerModo) modoHome = false;
      const favs = await obtenerFavoritos();
      favoritosIds = new Set(favs.map(f => f.id));
      visibleItems = 8;
      renderProductos();
    } catch(e) { showToast('Error al cargar productos', true); }
  }

  // ========== FILTROS ==========
  function setupCategorias() {
    const cats = ["all", "Electrónica", "Ropa", "Libros", "Mascotas", "Hogar", "Deportes", "Otros"];
    const icons = { all:"fa-store", Electrónica:"fa-laptop", Ropa:"fa-tshirt", Libros:"fa-book", Mascotas:"fa-paw", Hogar:"fa-home", Deportes:"fa-futbol", Otros:"fa-tag" };
    const names = { all:"Todos", Electrónica:"Electrónica", Ropa:"Ropa", Libros:"Libros", Mascotas:"Mascotas", Hogar:"Hogar", Deportes:"Deportes", Otros:"Otros" };
    const container = document.getElementById("categoriesNav");
    container.innerHTML = cats.map(cat => `<div class="cat-item ${cat === 'all' ? 'active' : ''}" data-cat="${cat}"><i class="fas ${icons[cat]}"></i> ${names[cat]}</div>`).join('');
    document.querySelectorAll('.cat-item').forEach(c => {
      c.addEventListener('click', () => {
        document.querySelectorAll('.cat-item').forEach(cat => cat.classList.remove('active'));
        c.classList.add('active');
        currentCategory = c.getAttribute('data-cat');
        visibleItems = 8;
        renderProductos();
      });
    });
  }
  
  // Botón Home (Hogar)
  document.getElementById("homeBtn").addEventListener('click', async () => {
    modoHome = true;
    currentCategory = "all";
    searchQuery = "";
    document.getElementById('searchInput').value = "";
    document.querySelectorAll('.cat-item').forEach(c => c.classList.remove('active'));
    document.querySelector('.cat-item[data-cat="all"]')?.classList.add('active');
    visibleItems = 8;
    await cargarProductos(true);
    showToast("🏠 Mostrando tus publicaciones y favoritos");
  });
  
  document.getElementById("searchInput").addEventListener('input', (e) => { 
    searchQuery = e.target.value; 
    modoHome = false; 
    visibleItems = 8; 
    renderProductos(); 
  });
  document.getElementById("loadMoreBtn").addEventListener('click', loadMore);
  document.getElementById("userProfileBadge").addEventListener("click", () => { showToast(`👤 ${currentUser?.name || currentUser?.email}`); });
  
  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

  // ========== INICIALIZACIÓN ==========
  async function init() {
    const token = getTokenFromURL();
    if (token) { 
      authToken = token; 
      const user = await verifyToken(token); 
      if (user) {
        currentUser = user;
      } else { 
        localStorage.removeItem('auth_token'); 
        authToken = null; 
      }
    }
    
    if (currentUser) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appContainer').classList.add('active');
      const avatarDiv = document.getElementById('headerAvatar');
      if (currentUser.picture) {
        avatarDiv.innerHTML = `<img src="${currentUser.picture}">`;
      } else {
        avatarDiv.innerHTML = `<i class="fas fa-user"></i>`;
      }
      document.getElementById('headerUserName').innerText = currentUser.name?.split(' ')[0] || 'Perfil';
      await cargarProductos();
    } else {
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('appContainer').classList.remove('active');
    }
    setupCategorias();
  }
  
  document.getElementById("googleLoginBtn").onclick = loginWithGoogle;
  init();
  
  // OneSignal
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) { 
    await OneSignal.init({ 
      appId: "68491021-9c85-423d-9e50-ddcffa0c2d63", 
      notifyButton: { enable: true, position: 'bottom-right', theme: 'inverse' } 
    }); 
  });
</script>
</body>
